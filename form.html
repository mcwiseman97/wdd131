<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Michael Wiseman | WDD131 | Temple Picture Album</title>
        <meta name="description" content="Product review form. Outlined for the use of the class WDD131 to learn about input methods with the HTML language.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Michael Wiseman">
        <link rel="stylesheet" href="./styles/form.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&display=swap" rel="stylesheet">
        <script src="scripts/form.js" defer></script>
    </head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <fieldset>
                <legend>Product Information</legend>
                
                <label for="product-name">Product Name <span class="required">*</span></label>
                <select id="product-name" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <div class="rating-container">
                    <span class="rating-label">Overall Rating <span class="required">*</span></span>
                    <div class="stars">
                        <input type="radio" id="star5" name="rating" value="5" required>
                        <label for="star5" title="5 stars">☆</label>
                        <input type="radio" id="star4" name="rating" value="4" required>
                        <label for="star4" title="4 stars">☆</label>
                        <input type="radio" id="star3" name="rating" value="3" required>
                        <label for="star3" title="3 stars">☆</label>
                        <input type="radio" id="star2" name="rating" value="2" required>
                        <label for="star2" title="2 stars">☆</label>
                        <input type="radio" id="star1" name="rating" value="1" required>
                        <label for="star1" title="1 star">☆</label>
                    </div>
                </div>

                <label for="install-date">Date of Installation <span class="required">*</span></label>
                <input type="date" id="install-date" name="installDate" required>
            </fieldset>

            <fieldset>
                <legend>Your Review</legend>

                <span class="checkbox-legend">Useful Features (Check all that apply)</span>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" name="features" value="ease-of-use"> Ease of Use</label>
                    <label><input type="checkbox" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" name="features" value="design"> Sleek Design</label>
                </div>

                <label for="written-review">Written Review</label>
                <textarea id="written-review" name="writtenReview" rows="5" placeholder="Share your experience with this product..."></textarea>

                <label for="user-name">Your Name</label>
                <input type="text" id="user-name" name="userName" placeholder="Optional">
            </fieldset>

            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>ⓒ<span id="currentyear"></span> | Michael Wiseman | 🇺🇸 Texas, USA 🇺🇸</p>
    </footer>
    
</body>
</html>
