<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Michael Wiseman | WDD131 | Will &amp; Way</title>
    <meta name="description" content="WDD131 Course Project on productivity tools and focusing on the things that will keep you moving forward in your goals.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Michael Wiseman">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;1,400&family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/main.css">
    <script src="scripts/main.js" defer></script>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-box">
                <img src="images/will_and_way.webp" alt="Will and Way Logo" class="logo" width="60" height="43">
            </div>
            <span class="site-title">Will &amp; Way</span>
            <button type="button" class="menu-toggle" aria-label="Toggle Menu">☰ Menu</button>
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="about.html">About Will &amp; Way</a>
                <a href="tools.html" class="active">Tools</a>
            </nav>
        </div>
    </header>
    <main class="dashboard-grid">
        <section class="card timer-card">
            <div class="timer-display" id="timerDisplay">25:00</div>
            <div class="timer-controls">
                <button type="button" id="startBtn">Start</button>
                <button type="button" id="stopBtn" class="secondary-btn">Stop</button>
            </div>
        </section>
    
        <section class="card tasks-card">
            <div class="tasks-header">
                <h2>Tasks</h2>
                <span class="due-label">Due</span>
            </div>
            <ul id="taskList"></ul>
            <div class="action-row">
                <button type="button" id="addTaskBtn" class="action-btn">+ Task</button>
            </div>
        </section>
    
        <section class="card habits-card">
            <h2>Habits</h2>
            <ul id="habitList"></ul>
            <div class="action-row">
                <button type="button" id="addHabitBtn" class="action-btn">+ Habit</button>
            </div>
        </section>
    
        <section class="card notes-card">
            <h2>Notes</h2>
            <textarea id="notesArea" placeholder="Jot down quick thoughts..."></textarea>
        </section>
    </main>
    <footer>
        <p>© 2026 | Michael Wiseman | 🇺🇸 Texas, USA 🇺🇸</p>
        <p><a href="references.html">References</a></p>
    </footer>
</body>
</html>
